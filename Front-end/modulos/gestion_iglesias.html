<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Iglesias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="bg-light">
    <!-- Barra de navegación simple para volver -->
    <nav class="navbar navbar-dark topbar mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../dashboard.html">⬅ Volver al Panel</a>
        </div>
    </nav>

    <main class="container">
        <!-- Panel de Gestión de Iglesias -->
        <div class="card shadow-sm mb-4 border-0">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 fw-bold">Gestión de Iglesias</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Municipio</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyIglesias">
                            <tr><td colspan="5" class="text-center">Cargando registros...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal para Editar Iglesia -->
    <div class="modal fade" id="modalEditarIglesia" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0 pb-0 mt-2 mx-2">
                    <h5 class="modal-title fw-bold fs-4">Editar Iglesia</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    
                </div>
                <div class="modal-body pt-4 mx-2 mb-2">
                    <form id="formEditarIglesia">
                        <input type="hidden" id="editId">
                        
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-bold small">Nombre *</label>
                                <input type="text" class="form-control" id="editNombre" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold small">Tipo *</label>
                                <select class="form-select" id="editTipo" required>
                                    <option>Iglesia</option>
                                    <option>Parroquia</option>
                                    <option>Capilla</option>
                                    <option>Otro</option>
                                </select>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-bold small">Descripción</label>
                                <textarea class="form-control" id="editDescripcion" rows="2"></textarea>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Estado (Aprobación)</label>
                                <select class="form-select" id="editEstado" required>
                                    <option value="activo">Activo (Visible en mapa público)</option>
                                    <option value="inactivo">Inactivo / Pendiente (Oculto)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Municipio</label>
                                <input type="text" class="form-control" id="editMunicipio">
                            </div>
                        </div>
                        
                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary px-4">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/gestion_iglesias.js"></script>
</body>
</html>
