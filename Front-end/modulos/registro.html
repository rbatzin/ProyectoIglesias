<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Iglesias Antigua GT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 text-success">Crear Cuenta</h3>
                        <div id="mensaje-alerta" class="alert d-none" role="alert"></div>
                        <form id="registroForm">
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="login" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Registrarme</button>
                            <a href="../index.html" class="btn btn-link w-100 mt-2 text-center text-decoration-none">Volver al mapa</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/registro.js"></script>
</body>
</html>
