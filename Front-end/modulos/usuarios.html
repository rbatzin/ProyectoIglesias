<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Iglesias Antigua GT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark topbar mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../dashboard.html"> Volver al Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0" id="tituloFormulario">Registrar Nuevo Usuario</h5>
                    </div>
                    <div class="card-body">
                        <form id="formUsuario">
                            <div class="mb-3">
                                <label class="form-label">Usuario (Login)</label>
                                <input type="text" class="form-control" id="login" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">ID del Grupo</label>
                                <input type="number" class="form-control" id="grupo" required min="1">
                            </div>
                            <button type="submit" class="btn btn-success w-100" id="btnGuardar">Guardar Usuario</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Usuario</th>
                                    <th>Grupo</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaUsuarios"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/usuarios.js"></script>
</body>
</html>
