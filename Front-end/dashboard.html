<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Iglesias Antigua GT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark topbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">⛪ Panel de Administración</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- El menú se inyectará aquí desde JavaScript -->
                <ul class="navbar-nav me-auto" id="menu-dinamico"></ul>
                <button id="btnCerrarSesion" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="card shadow border-0">
            <div class="card-body text-center p-5">
                <h2 class="text-success mb-3 fw-bold">Bienvenido al Sistema</h2>
                <p class="text-muted lead">Selecciona una opción del menú superior para comenzar a administrar el catálogo.</p>
                <a href="index.html" class="btn btn-outline-secondary mt-3">Ir al mapa público</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
